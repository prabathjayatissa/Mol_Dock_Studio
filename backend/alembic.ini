# Alembic configuration for MolDock Studio.
#
# The database URL is intentionally NOT set here: `alembic/env.py` reads it from
# the application settings (`MOLDOCK_DATABASE_URL`, or the derived SQLite path),
# so migrations always target exactly the database the app would use.
#
# Usage (run from `backend/`):
#   uv run alembic revision --autogenerate -m "describe the change"
#   uv run alembic upgrade head
#   uv run alembic downgrade -1
#
# SQLite deployments create their schema from the models at start-up
# (`Base.metadata.create_all`); Alembic is the path to versioned schema changes
# and to PostgreSQL. See docs/architecture.md.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timezone-aware timestamps, so a generated filename says when it was made.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
