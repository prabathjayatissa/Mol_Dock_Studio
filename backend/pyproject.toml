[project]
name = "moldock-studio-backend"
version = "0.1.0"
description = "MolDock Studio backend: molecular structure I/O, preparation, docking and interaction analysis services"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<3",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.12",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-image>=0.24,<1",
    "gemmi>=0.6.7",
    "rdkit>=2024.9",
    "biopython>=1.84",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
# Meeko (pure Python) is installable on macOS arm64 and covers Phase 2 PDBQT
# ligand/receptor preparation. Keep it in its own extra so it does not pull in
# AutoDock Vina, which ships manylinux x86_64 wheels only and is not
# installable here; docking is reached through Docker or a native binary.
prep = ["meeko>=0.6"]

# AutoDock Vina ships manylinux x86_64 wheels only. On macOS arm64 these are
# not installable; docking is reached through Docker or a native Vina binary.
docking = ["vina>=1.2.7"]
protein-prep = ["pdb2pqr>=3.6"]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "scientific: scientific sanity / validation checks",
    "slow: tests that take more than a few seconds",
    "network: tests that reach the public RCSB PDB over the internet",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501  - line length is already capped by the formatter; long URLs/strings are fine.
# B008  - FastAPI's documented dependency-injection idiom requires calling
#         Depends()/File()/Form()/Query() in argument defaults.
ignore = ["E501", "B008"]
